<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cyberGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="radarSweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0)" />
      <stop offset="70%" stop-color="rgba(99, 102, 241, 0.08)" />
      <stop offset="100%" stop-color="rgba(129, 140, 248, 0.3)" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes radarRotate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes scanVertical {
        0% { transform: translateY(0px); opacity: 0.1; }
        50% { opacity: 0.8; }
        100% { transform: translateY(380px); opacity: 0.1; }
      }
      @keyframes pulseNode {
        0%, 100% { transform: scale(1); opacity: 0.4; }
        50% { transform: scale(1.3); opacity: 0.9; }
      }
      @keyframes floatParticle {
        0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
        50% { transform: translateY(-12px) translateX(8px); opacity: 0.8; }
        100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      }

      .radar-sweep {
        transform-origin: 1040px 190px;
        animation: radarRotate 14s linear infinite;
      }
      .scan-beam {
        animation: scanVertical 6s ease-in-out infinite;
      }
      .node-pulse {
        animation: pulseNode 3s ease-in-out infinite;
      }
      .node-pulse-delayed {
        animation: pulseNode 3.5s ease-in-out 1.2s infinite;
      }
      .particle {
        animation: floatParticle 5s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1280" height="380" fill="url(#bgGrad)" />

  <!-- Geometric Grid Pattern -->
  <g stroke="rgba(255, 255, 255, 0.04)" stroke-width="1">
    <line x1="0" y1="60" x2="1280" y2="60" />
    <line x1="0" y1="120" x2="1280" y2="120" />
    <line x1="0" y1="180" x2="1280" y2="180" />
    <line x1="0" y1="240" x2="1280" y2="240" />
    <line x1="0" y1="300" x2="1280" y2="300" />
    <line x1="160" y1="0" x2="160" y2="380" />
    <line x1="320" y1="0" x2="320" y2="380" />
    <line x1="480" y1="0" x2="480" y2="380" />
    <line x1="640" y1="0" x2="640" y2="380" />
    <line x1="800" y1="0" x2="800" y2="380" />
    <line x1="960" y1="0" x2="960" y2="380" />
    <line x1="1120" y1="0" x2="1120" y2="380" />
  </g>

  <!-- Dynamic Security Scanning Radar & Graph on Right (Behind Text) -->
  <g opacity="0.85">
    <circle cx="1040" cy="190" r="140" fill="none" stroke="rgba(99, 102, 241, 0.15)" stroke-width="2" />
    <circle cx="1040" cy="190" r="95" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.5" stroke-dasharray="6,6" />
    <circle cx="1040" cy="190" r="50" fill="none" stroke="rgba(192, 132, 252, 0.25)" stroke-width="1.5" />
    
    <!-- Rotating Radar Sweep -->
    <path class="radar-sweep" d="M1040,190 L1180,190 A140,140 0 0,0 1040,50 Z" fill="url(#radarSweep)" />

    <!-- Connected AST / Taint Flow Graph Nodes -->
    <line x1="940" y1="130" x2="1000" y2="180" stroke="rgba(56, 189, 248, 0.4)" stroke-width="2" />
    <line x1="1000" y1="180" x2="1080" y2="150" stroke="rgba(99, 102, 241, 0.5)" stroke-width="2" />
    <line x1="1080" y1="150" x2="1140" y2="210" stroke="rgba(16, 185, 129, 0.4)" stroke-width="2" />
    <line x1="1000" y1="180" x2="1030" y2="250" stroke="rgba(244, 63, 94, 0.4)" stroke-width="2" />

    <circle class="node-pulse" cx="940" cy="130" r="7" fill="#38bdf8" />
    <circle class="node-pulse-delayed" cx="1000" cy="180" r="9" fill="#818cf8" />
    <circle class="node-pulse" cx="1080" cy="150" r="8" fill="#c084fc" />
    <circle class="node-pulse-delayed" cx="1140" cy="210" r="6" fill="#10b981" />
    <circle class="node-pulse" cx="1030" cy="250" r="7" fill="#f43f5e" />
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="70" r="160" fill="rgba(56, 189, 248, 0.08)" filter="url(#softGlow)" />
  <circle cx="700" cy="300" r="180" fill="rgba(129, 140, 248, 0.07)" filter="url(#softGlow)" />

  <!-- Animated Laser Scan Beam -->
  <g class="scan-beam">
    <line x1="0" y1="0" x2="1280" y2="0" stroke="rgba(56, 189, 248, 0.4)" stroke-width="2" filter="url(#glow)" />
    <line x1="0" y1="1" x2="1280" y2="1" stroke="rgba(99, 102, 241, 0.2)" stroke-width="6" />
  </g>

  <!-- Foreground Content (Header, Badge Pills, Subtitle) -->
  <g transform="translate(80, 0)">
    <!-- Top Category Tag Pill -->
    <g transform="translate(0, 52)">
      <rect width="320" height="34" rx="17" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1.5" />
      <circle cx="20" cy="17" r="5" fill="#10b981" filter="url(#glow)" />
      <text x="35" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#93c5fd" letter-spacing="1">
        DEVSECOPS &amp; APPLICATION SECURITY
      </text>
    </g>

    <!-- Main Title -->
    <text x="0" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Awesome <tspan fill="url(#primaryGrad)">Static Code Analysis</tspan>
    </text>
    <text x="0" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#e2e8f0" letter-spacing="-0.5">
      &amp; SAST Ecosystem 🛡️⚡
    </text>

    <!-- Subtitle -->
    <text x="0" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      Curated guide to enterprise SaaS platforms &amp; high-performance open-source code scanners.
    </text>
    <text x="0" y="266" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#64748b">
      Semantic taint tracking • Vulnerability research • AST pattern matching • CI/CD Quality Gates
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 296)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="130" height="30" rx="15" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
      <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#7dd3fc">✦ CodeQL &amp; AST</text>

      <!-- Pill 2 -->
      <rect x="142" y="0" width="145" height="30" rx="15" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(129, 140, 248, 0.3)" stroke-width="1" />
      <text x="156" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#a5b4fc">✦ Taint Dataflow</text>

      <!-- Pill 3 -->
      <rect x="299" y="0" width="140" height="30" rx="15" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1" />
      <text x="313" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#6ee7b7">✦ Secrets &amp; IaC</text>

      <!-- Pill 4 -->
      <rect x="451" y="0" width="155" height="30" rx="15" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(244, 63, 94, 0.3)" stroke-width="1" />
      <text x="465" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#fda4af">✦ Zero False-Positives</text>
    </g>
  </g>
</svg>
